<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add/Edit Task - Task Manager</title>
  <meta name="description" content="Add a new task or edit an existing one">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="add-task">
  <header class="glass-panel" style="margin: 2rem; padding: 1rem 2rem;">
    <h1>Task Manager</h1>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="tasks.html">My Tasks</a>
      <a href="add-task.html" style="color: var(--primary-color);" id="navAddEdit">Add Task</a>
      <a href="#" id="logoutBtn">Logout</a>
    </nav>
  </header>

  <main class="container" style="max-width: 600px;">
    <h2 id="pageTitle">Create New Task</h2>
    
    <div id="alertContainer" class="alert"></div>

    <div class="glass-panel" style="padding: 2rem;">
      <form id="taskForm">
        <input type="hidden" id="taskId">
        
        <div class="form-group">
          <label for="taskTitle">Title</label>
          <input type="text" id="taskTitle" class="form-control" placeholder="Enter task title" required>
        </div>
        
        <div class="form-group">
          <label for="taskDescription">Description</label>
          <textarea id="taskDescription" class="form-control" placeholder="Enter task description" rows="3"></textarea>
        </div>
        
        <div class="form-group">
          <label for="taskDueDate">Due Date</label>
          <input type="date" id="taskDueDate" class="form-control">
        </div>
        
        <div class="form-group" id="statusGroup" style="display: none;">
          <label for="taskStatus">Status</label>
          <select id="taskStatus" class="form-control">
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="submit" class="btn btn-primary" id="submitBtn">Save Task</button>
          <a href="tasks.html" class="btn btn-outline">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>

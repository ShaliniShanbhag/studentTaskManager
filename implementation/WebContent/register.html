<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager - Register</title>
  <meta name="description" content="Register for the Task Management System">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="register">
  <div class="auth-container container">
    <div class="auth-card glass-panel">
      <h2>Create Account</h2>
      <div id="authAlert" class="alert"></div>
      
      <form id="registerForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Create a password (min 6 chars)" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
      </form>
      
      <div style="text-align: center; margin-top: 1.5rem; color: var(--text-muted);">
        <p>Already have an account? <a href="index.html" style="color: var(--primary-color);">Login</a></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
